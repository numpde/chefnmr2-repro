# Localhost NMR API deployment for provider:chefnmr2-fw-a.

[offering]
analysis_kind = "mol_from_1h_13c_formula"
description = 'Test offering: JSON with "formula" and "peaks" (carbon shifts in "c", proton [ppm, integration, multiplicity] triples in "h"). Uses eight samples and seed 0.'
n_samples = 8
seed = 0

[runner]
role = "chefnmr2"
# Match the runner's --socket in docker/compose/inference.yaml and the lease file
# created by docker/containers/worker/Dockerfile, both on the runner volume.
socket = "/run/chefnmr2/runner.sock"
lease_file = "/run/chefnmr2/.owner-session.lock"
# Connection/greeting allowance. Model loading happens after worker launch.
startup_seconds = 30
retirement_seconds = 30

[model]
checkpoint_dirs = ["/checkpoints/chefnmr2-epoch949"]
device = "cpu"
recon_workers = 2

[execution]
backend = "process"

[execution.host]
input_bytes = 8192
result_bytes = 65536
state_values = 1
progress_records = 1
initialization_seconds = 120
retirement_seconds = 30

[execution.operation_policy]
queue_stop_request_seconds = 5
execution_stop_request_seconds = 60
cleanup_overdue_flag_seconds = 30
reject_encoded_input_over_bytes = 8192
reject_encoded_result_over_bytes = 65536

# Make at most three attempts when the SDK confirms a retryable refusal.
# Failed calculations propagate; enabling their retry would repeat the science.
[execution.error_policy]
max_attempts = 3
backoff_initial_seconds = 0.1
backoff_max_seconds = 1
retry_admission_codes = ["capacity", "unavailable"]
retry_scientific_failures = false

# SDK admission accounts for the model operation. Compose enforces container limits.
[[execution.resource_requirement]]
kind = "cpu"
amount = 1
unit = "thread"
selector = "generic"
exclusive = false

[api]
origin = "https://nmr.localhost:10443"
profile = "dev-local"
topology = "dev-local"
provider_ref = "provider:chefnmr2-fw-a"
credential_file = "/run/chefnmr2-credentials/credential.json"
ca_file = "/run/config/api-ca.pem"
exchange_seconds = 30
retirement_seconds = 10

[shared]
project = "nmr-api-delivery"
gid = 1000

[service]
lifetime_directory = "/run/chefnmr2-provider"

[service.policy]
feed_seconds = 5
hello_seconds = 3600
observation_seconds = 1
recovery_seconds = 90
retry_max_seconds = 30
settle_seconds = 10
