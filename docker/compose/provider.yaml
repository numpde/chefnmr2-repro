# Combine with inference.yaml for the localhost API provider.
# Only this service receives the signing credential and API socket grants.
services:
  provider:
    platform: linux/amd64
    build:
      context: ../containers/provider
      additional_contexts:
        shared: ../containers/_shared
        dependency-pins: ../../requirements
    command: [--config, /config/provider.toml]
    depends_on: [worker]
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3", compress: "true"}
    init: true
    stop_signal: SIGINT
    stop_grace_period: 90s
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 32
    # The localhost shared delivery deployment grants socket access to GID 1000.
    group_add: ["1000"]
    environment:
      PROVIDER_CORE_IN_CONTAINER: "1"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    configs:
      - source: localhost_provider
        target: /config/provider.toml
      - source: localhost_api_ca
        target: /run/config/api-ca.pem
    volumes:
      - runner:/run/chefnmr2:ro
      - provider-lifetime:/run/chefnmr2-provider
      - type: volume
        source: credentials
        target: /run/chefnmr2-credentials
        read_only: true
        volume: {nocopy: true}
      - type: volume
        source: api-proxy
        target: /run/nmr-api-proxy
        read_only: true
        volume: {nocopy: true}
      - type: volume
        source: api-outbox
        target: /run/nmr-api-outbox
        read_only: true
        volume: {nocopy: true}

configs:
  localhost_provider:
    file: ../../config/deployments/localhost/provider.toml
  localhost_api_ca:
    file: ${CHEFNMR2_API_CA:?Set CHEFNMR2_API_CA to the localhost API CA certificate}

volumes:
  provider-lifetime: {}
  credentials:
    external: true
    name: chefnmr2-inference_credentials
  api-proxy:
    external: true
    name: nmr-api-delivery-proxy-socket
  api-outbox:
    external: true
    name: nmr-api-delivery-outbox-socket
