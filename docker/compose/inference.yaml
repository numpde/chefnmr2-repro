name: chefnmr2-inference

services:
  manual:
    platform: linux/amd64
    profiles: [manual]
    build:
      context: ../containers/provider
      additional_contexts:
        shared: ../containers/_shared
        dependency-pins: ../../requirements
    command: [--config, /config/provider.toml]
    entrypoint: [python, manual.py]
    depends_on: [worker]
    stdin_open: true
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3", compress: "true"}
    init: true
    stop_signal: SIGINT
    stop_grace_period: 90s
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 32
    environment:
      PROVIDER_CORE_IN_CONTAINER: "1"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
    configs:
      - source: test_provider
        target: /config/provider.toml
    volumes:
      - runner:/run/chefnmr2:ro

  worker:
    platform: linux/amd64
    build:
      context: ../containers/worker
      additional_contexts:
        shared: ../containers/_shared
        upstream: ../../chefnmr2-upstream
        dependency-pins: ../../requirements
    command:
      - --role
      - chefnmr2
      - --socket
      - /run/chefnmr2/runner.sock
      - --scratch
      - /run/chefnmr2-scratch
      - --status-directory
      - /run/chefnmr2-status
      - --owner-session-lifetime
      - --startup-seconds
      - "30"
      - --terminate-seconds
      - "10"
      - --kill-seconds
      - "5"
      - --cleanup-seconds
      - "10"
      - --
      - python
      - -m
      - provider_core.process_worker
    logging:
      driver: local
      options: {max-size: "10m", max-file: "3", compress: "true"}
    init: true
    stop_signal: SIGINT
    stop_grace_period: 30s
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    cpus: 2
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 64
    environment:
      PROVIDER_CORE_IN_CONTAINER: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=64m
      - /run/chefnmr2-scratch:rw,nosuid,nodev,noexec,size=64m,uid=65532,gid=65532,mode=0700
      - /run/chefnmr2-status:rw,nosuid,nodev,noexec,size=1m,uid=65532,gid=65532,mode=0700
    volumes:
      - checkpoints:/checkpoints:ro
      - runner:/run/chefnmr2

configs:
  test_provider:
    file: ../../config/deployments/test/provider.toml

volumes:
  checkpoints:
    external: true
    name: chefnmr2-weights_checkpoints
  runner: {}
