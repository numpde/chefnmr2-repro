name: chefnmr2-weights

# Acquire the pinned ChefNMR2 ensemble into one persistent Docker volume
# volume-init grants downloader ownership, download installs verified files,
# and verify checks sanitized file hashes without network or writes
# Run with an explicit local Docker context and Compose project
# `make weights/download` initializes and verifies acquisition; sanitization is separate
# Recheck without downloading weights: `run --rm --no-deps verify`.
#
# Output lives in Docker's <project>_checkpoints volume, not in this checkout
# For project chefnmr2-weights, that is chefnmr2-weights_checkpoints
# Containers see /checkpoints/chefnmr2-epoch<epoch>/{config.yaml,model.pt}
# A fresh successful run leaves 20 verified files across ten epoch directories
# Each .part is renamed after verification, so there is no second staging copy
# Failure or interruption retains completed files and any .part for inspection/resume
# Existing unrelated regular files are neither verified nor removed
#
# Make removes each one-shot container when it exits
# `down --remove-orphans` removes leftovers/network but keeps the volume and cached image
# `down --volumes` also deletes the checkpoints
#
# The checkpoint volume has no filesystem quota. Curl bounds each transfer
# CPU, RAM and PID ceilings follow magnet/docker/compose/fetch.yaml
x-curl-image: &curl-image docker.io/curlimages/curl:8.21.0@sha256:7c12af72ceb38b7432ab85e1a265cff6ae58e06f95539d539b654f2cfa64bb13

x-contained: &contained
  # The digest-pinned curl image is about 11 MB, so Compose may fetch it when missing
  image: *curl-image
  logging:
    driver: local
    options: {max-size: "1m", max-file: "2", compress: "true"}
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: "no"

x-checksums: &checksums
  type: bind
  source: model/checkpoints.sha256
  target: /checks/checkpoints.sha256
  read_only: true
  bind:
    create_host_path: false

networks:
  fetch-egress: {}

volumes:
  checkpoints: {}

services:
  volume-init:
    <<: *contained
    user: "0:0"
    network_mode: none
    cap_add:
      # The downloader must own the volume root to reopen its 0555 directory
      - CHOWN
    pids_limit: 16
    cpus: 0.25
    mem_limit: 32m
    memswap_limit: 32m
    volumes:
      - type: volume
        source: checkpoints
        target: /checkpoints
        volume:
          nocopy: true
    entrypoint: [chown]
    command: ["curl_user:curl_group", /checkpoints]

  download:
    <<: *contained
    user: "curl_user:curl_group"
    environment:
      # This endpoint must be reachable from the container, not just host loopback
      PROXY_URL: ${PROXY_URL:-}
    networks:
      - fetch-egress
    pids_limit: 64
    cpus: 1
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      volume-init:
        condition: service_completed_successfully
    working_dir: /checkpoints
    volumes:
      - type: volume
        source: checkpoints
        target: /checkpoints
        volume:
          nocopy: true
      - *checksums
    entrypoint: [/bin/sh, -eu, -c]
    command:
      - |
        # Compose turns $$ into $ before the container shell expands variables
        case "$$PROXY_URL" in
          '')
            printf '%s\n' 'Cannot download checkpoints: set PROXY_URL=<url> or PROXY_URL=none.' >&2
            exit 2
            ;;
          none) download_proxy= ;;
          *) download_proxy=$$PROXY_URL ;;
        esac
        checkpoint_release_url=https://huggingface.co/ziyux123/chefnmr2/resolve/38a741cce3e6f7e0d5a827a66f8d3dea0728daf5
        checksum_file=/checks/checkpoints.sha256

        # Reject links and special files before opening paths in the reused volume
        non_regular_entry=$$(find /checkpoints -xdev ! -type d ! -type f -print -quit)
        if test -n "$$non_regular_entry"; then
          printf 'Cannot download checkpoints: volume contains a non-regular entry: %s\n' "$$non_regular_entry" >&2
          exit 1
        fi

        # The downloader owns these directories and may reopen a sealed volume
        chmod 0755 /checkpoints
        while read -r expected_sha256 maximum_file_bytes checkpoint_file; do
          case "$$expected_sha256" in '#'*) continue ;; esac
          checkpoint_directory=$${checkpoint_file%/*}

          # Directories must be traversable by the model's different non-root user
          umask 022
          mkdir -p "$$checkpoint_directory"
          chmod 0755 "$$checkpoint_directory"

          if test -f "$$checkpoint_file"; then
            if printf '%s  %s\n' "$$expected_sha256" "$$checkpoint_file" | sha256sum -c - >/dev/null 2>&1; then
              continue
            fi
            printf 'Restoring pinned source %s\n' "$$checkpoint_file"
          fi

          partial_file=$$checkpoint_file.part

          # Partial files stay private until their checksum matches
          umask 077
          # Curl durations are seconds and the slow-transfer limit is bytes/second
          # --disable must be first to ignore curlrc. --continue-at - uses the local file size
          # Empty --proxy selects direct routing; empty --noproxy prevents inherited bypasses
          printf 'Downloading %s (resuming any partial file)\n' "$$checkpoint_file"
          curl --disable --fail --location --show-error --no-progress-meter \
            --proxy "$$download_proxy" --noproxy '' \
            --proto '=https' --proto-redir '=https' \
            --retry 5 --retry-all-errors --retry-delay 2 --retry-max-time 7200 \
            --connect-timeout 15 --max-time 3600 \
            --speed-limit 1024 --speed-time 60 --max-filesize "$$maximum_file_bytes" \
            --continue-at - --output "$$partial_file" "$$checkpoint_release_url/$$checkpoint_file"

          printf '%s  %s\n' "$$expected_sha256" "$$partial_file" | sha256sum -c -
          chmod 0444 "$$partial_file"
          # Changing either member invalidates the checkpoint bundle's receipt.
          rm -f "$$checkpoint_directory/model.pt.sanitized.json"
          sync
          mv "$$partial_file" "$$checkpoint_file"
        done < "$$checksum_file"

        # sha256sum consumes only the hash and path, not the per-file download cap
        awk '!/^#/ { print $$1 "  " $$3 }' "$$checksum_file" | sha256sum -c -

        # Seal only after the whole ensemble passes: files readable, directories traversable
        while read -r expected_sha256 maximum_file_bytes checkpoint_file; do
          case "$$expected_sha256" in '#'*) continue ;; esac
          checkpoint_directory=$${checkpoint_file%/*}
          chmod 0444 "$$checkpoint_file"
          chmod 0555 "$$checkpoint_directory"
        done < "$$checksum_file"
        chmod 0555 /checkpoints

  verify:
    <<: *contained
    image: chefnmr2/weights-sanitizer:local
    pull_policy: never
    user: "100:101"
    network_mode: none
    pids_limit: 16
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m
    working_dir: /checkpoints
    volumes:
      - type: volume
        source: checkpoints
        target: /checkpoints
        read_only: true
        volume:
          nocopy: true
      - *checksums
    entrypoint: [python, -IB, /opt/sanitize/sanitize.py]
    command: [--verify, --pattern, "*/model.pt", --companion, config.yaml]

  sanitize:
    <<: *contained
    # Preparation is independent of the selected CPU/CUDA inference image.
    image: chefnmr2/weights-sanitizer:local
    pull_policy: never
    user: "100:101"
    network_mode: none
    pids_limit: 64
    cpus: 1
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - type: volume
        source: checkpoints
        target: /checkpoints
        volume: {nocopy: true}
      - *checksums
    entrypoint: [python, -IB, /opt/sanitize/sanitize.py]
    command: [--pattern, "*/model.pt", --companion, config.yaml]
