name: "${IMAGE_NAMESPACE:?Set IMAGE_NAMESPACE}-weights"

# Acquire pinned checkpoints into one retained volume. Model-specific source
# and sanitizer settings are supplied by model/weights.yaml.
# Acquisition is online through the relay; verification and preparation are offline.
# Each .part is renamed only after verification; interrupted transfers can resume.
# Down without --volumes retains checkpoints. The volume itself has no space quota.
x-contained: &contained
  # The digest-pinned curl image is about 11 MB, so Compose may fetch it when missing
  extends:
    file: compose/images.yaml
    service: checkpoint-download
  logging:
    driver: local
    options: {max-size: "1m", max-file: "2", compress: "true"}
  init: true
  read_only: true
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  restart: "no"

x-checksums: &checksums
  type: bind
  source: model/checkpoints.sha256
  target: /checks/checkpoints.sha256
  read_only: true
  bind:
    create_host_path: false

volumes:
  checkpoints: {}

services:
  volume-init:
    <<: *contained
    user: "0:0"
    network_mode: none
    cap_add:
      # The downloader must own the volume root to reopen its 0555 directory
      - CHOWN
    pids_limit: 16
    cpus: 0.25
    mem_limit: 32m
    memswap_limit: 32m
    volumes:
      - type: volume
        source: checkpoints
        target: /checkpoints
        volume:
          nocopy: true
    entrypoint: [chown]
    command: ["curl_user:curl_group", /checkpoints]

  download:
    <<: *contained
    user: "curl_user:curl_group"
    # make/weights.py gives this application the shared acquisition relay's
    # isolated namespace. Direct Compose execution has no network access.
    network_mode: none
    pids_limit: 64
    cpus: 1
    mem_limit: 256m
    memswap_limit: 256m
    depends_on:
      volume-init:
        condition: service_completed_successfully
    working_dir: /checkpoints
    volumes:
      - type: volume
        source: checkpoints
        target: /checkpoints
        volume:
          nocopy: true
      - *checksums
      - type: bind
        source: containers/checkpoint-download/download.sh
        target: /checks/download.sh
        read_only: true
        bind: {create_host_path: false}
    entrypoint: [/bin/sh, -eu, /checks/download.sh]
    command: [/checks/checkpoints.sha256]

  verify:
    <<: *contained
    extends:
      file: compose/images.yaml
      service: weights-sanitize
    build: !reset null
    pull_policy: never
    user: "100:101"
    network_mode: none
    pids_limit: 16
    cpus: 0.25
    mem_limit: 64m
    memswap_limit: 64m
    working_dir: /checkpoints
    volumes:
      - type: volume
        source: checkpoints
        target: /checkpoints
        read_only: true
        volume:
          nocopy: true
      - *checksums
    entrypoint: [python, -IB, /opt/sanitize/sanitize.py, --verify]

  sanitize:
    <<: *contained
    # Preparation is independent of the selected CPU/CUDA inference image.
    extends:
      file: compose/images.yaml
      service: weights-sanitize
    build: !reset null
    pull_policy: never
    user: "100:101"
    network_mode: none
    pids_limit: 64
    cpus: 1
    mem_limit: 4g
    memswap_limit: 4g
    environment:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    volumes:
      - type: volume
        source: checkpoints
        target: /checkpoints
        volume: {nocopy: true}
      - *checksums
    entrypoint: [python, -IB, /opt/sanitize/sanitize.py]
