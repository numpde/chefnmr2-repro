name: chefnmr2-nmr-dapp32-com
services:
  manual:
    cpus: 1
    mem_limit: 512m
    memswap_limit: 512m
    pids_limit: 32
  worker:
    extends:
      file: compose/images.yaml
      service: worker-cuda
    build: !reset null
    cpus: 2
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 64
    # Only this Ada is visible; it becomes cuda:0 inside the worker.
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            device_ids:
            - GPU-45b76e53-80bd-70cb-dd21-857e4b7f5347
            capabilities: [gpu]
configs:
  deployment_provider:
    file: deployments/nmr-dapp32-com/provider.toml
volumes:
  checkpoints:
    external: true
    name: chefnmr2-weights_checkpoints
